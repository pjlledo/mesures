<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medidas II y III</title>
<meta name="description" content="Diseño de las medidas de nivel II y III (ITACA 3) para un alumno/a, con explicación y ejemplo de cada medida. Exporta a Excel y PDF. Los datos no salen del dispositivo.">
<meta name="theme-color" content="#1d3a7a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d3a7a'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%237fa2ff'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%236fd49a'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%23ffcf5c'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%23ff8a7d'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eef1f7; --text:#131a2b; --muted:#5a6377; --border:#d8deea;
  --accent:#2350b5; --accent-hover:#1c4399; --accent-ink:#ffffff; --accent-soft:#e2e9fb; --navy:#1d3a7a;
  --sug:#1e8449; --sug-soft:#e3f3e9; --val:#9a6700; --val-soft:#fff4d6; --err:#c0392b; --err-soft:#fbe8e6;
  --sel:#e8eefc;
  --shadow:0 1px 2px rgba(19,26,43,.06),0 6px 20px rgba(19,26,43,.07);
  --radius:16px; --tap:44px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --surface:#181f2e; --surface-2:#212a3c; --text:#e8ecf5; --muted:#a2abbe; --border:#2e384d;
    --accent:#6f95ff; --accent-hover:#89a8ff; --accent-ink:#0b1430; --accent-soft:#1f2d52; --navy:#16264d;
    --sug:#6fd49a; --sug-soft:#163324; --val:#ffcf5c; --val-soft:#3a3017; --err:#ff8a7d; --err-soft:#3a1f1d;
    --sel:#1c2744;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#181f2e; --surface-2:#212a3c; --text:#e8ecf5; --muted:#a2abbe; --border:#2e384d;
  --accent:#6f95ff; --accent-hover:#89a8ff; --accent-ink:#0b1430; --accent-soft:#1f2d52; --navy:#16264d;
  --sug:#6fd49a; --sug-soft:#163324; --val:#ffcf5c; --val-soft:#3a3017; --err:#ff8a7d; --err-soft:#3a1f1d;
  --sel:#1c2744;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--surface-2);font-weight:600;text-decoration:none;white-space:nowrap;transition:background .15s,transform .05s}
.btn:active{transform:scale(.98)}
.btn:hover{background:color-mix(in srgb,var(--surface-2) 80%,var(--accent) 20%)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}

/* ---------- Cabecera ---------- */
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.topbar .row{display:flex;align-items:center;gap:10px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{flex:none;width:36px;height:36px;border-radius:10px;background:var(--navy);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:7px}
.logo i{border-radius:3px;display:block}
.logo i:nth-child(1){background:#7fa2ff}.logo i:nth-child(2){background:#6fd49a}.logo i:nth-child(3){background:#ffcf5c}.logo i:nth-child(4){background:#ff8a7d}
.brand strong{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acciones{display:flex;align-items:center;gap:6px}
.lang{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.lang button{border:0;background:transparent;padding:0 10px;min-height:36px;font-size:13px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.brand-txt{min-width:0}
@media (max-width:640px){
  .brand span{display:none}
  .acciones .btn .lbl{display:none}
  .acciones .btn{padding:0 10px}
}
@media (max-width:480px){
  .brand-txt{display:none}
  .acciones{margin-left:auto}
  .item.d1{padding-left:16px}.item.d2{padding-left:24px}
  .grupo.d1{padding-left:22px}
  .otros-in{margin-left:24px;width:calc(100% - 32px)}
}

/* ---------- Pasos ---------- */
.pasos{display:flex;gap:4px;padding:10px 0 12px;overflow-x:auto;scrollbar-width:none}
.pasos::-webkit-scrollbar{display:none}
.paso{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 8px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;text-align:left}
.paso:hover{background:var(--surface-2)}
.paso .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:2px solid var(--border);background:var(--surface)}
.paso .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paso .c{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}
.paso[aria-current="step"]{color:var(--text)}
.paso[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.paso.hecho .n{border-color:var(--accent);color:var(--accent)}
@media (max-width:640px){ .paso .t{display:none} .paso{justify-content:center;gap:4px;padding:6px 2px} }

/* ---------- Contenido ---------- */
main{padding:18px 0 120px}
h1{font-size:clamp(22px,4.5vw,28px);line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stack>*+*{margin-top:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label.f{display:block;font-weight:600;font-size:14px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:6px}
input[type=text],input[type=date],input[type=search],select,textarea{min-height:var(--tap);padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:16px;font-weight:400}
textarea{resize:vertical;min-height:72px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0;font-weight:400}
.hint.warn{color:var(--err);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.sug{background:var(--sug-soft);color:var(--sug)}
.chip.val{background:var(--val-soft);color:var(--val)}
.chip.et{background:var(--accent-soft);color:var(--accent)}
.etapa{margin-top:6px}

/* Perfiles */
.perf-grupo{margin-top:14px}
.perf-grupo h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.perfiles{display:flex;flex-wrap:wrap;gap:8px}
.perfil{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--text);min-height:38px}
.perfil:hover{border-color:var(--accent)}
.perfil[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.perfil .ast{font-size:11px;opacity:.7}
.sugbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--sug-soft)}
.sugbar p{margin:0;flex:1;min-width:200px;font-size:14px}
.fuente{font-size:12.5px;color:var(--muted);margin:12px 0 0}

/* ---------- Lista de medidas ---------- */
.toolbar{position:sticky;top:var(--topbar-h,112px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;background:var(--bg)}
.toolbar input[type=search]{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 12px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.bloque{margin-top:14px;padding:0;overflow:hidden}
.bloque>header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.bloque>header h2{flex:1;font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.04em}
.bloque>header .cnt{font-size:13px;font-weight:700;color:var(--muted)}
.lista{list-style:none;margin:0;padding:4px 0}
.lista li{border-top:1px solid var(--border)}
.lista li:first-child{border-top:0}
.grupo{display:flex;align-items:center;gap:8px;padding:10px 12px 6px 16px;font-weight:700;font-size:14.5px;color:var(--navy)}
:root[data-theme="dark"] .grupo{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .grupo{color:var(--accent)}}
.grupo .txt{flex:1}
.lista li.grupo{border-top:1px solid var(--border)}
.num{flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:13px;min-width:26px}
.item{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 8px;padding:6px 8px 6px 10px;transition:background .12s}
.item.on{background:var(--sel)}
.item.d1{padding-left:26px}.item.d2{padding-left:42px}
.grupo.d1{padding-left:28px;font-weight:650}
.item label{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;padding:6px 4px;cursor:pointer}
.item input[type=checkbox]{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);cursor:pointer}
.item .txt{flex:1;min-width:0}
.item .tags{display:flex;flex-wrap:wrap;gap:4px;padding-top:7px}
.item.fuera{opacity:.55}
.item.sug{box-shadow:inset 3px 0 0 var(--sug)}
.item.vsug{box-shadow:inset 3px 0 0 var(--val)}
.ib{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--accent);font-weight:800;font-family:Georgia,serif;font-size:16px;font-style:italic;margin-top:2px}
.ib:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.otros-in{flex-basis:100%;margin:0 0 6px 42px;width:calc(100% - 52px)}
.vacio{padding:24px;text-align:center;color:var(--muted)}

/* ---------- Detalles ---------- */
.det-bloque{margin-top:22px}
.det-bloque>h2{font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.medida{margin-top:10px}
.medida header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.medida header .tt{flex:1;min-width:0}
.medida header .ctx{font-size:12.5px;color:var(--muted);font-weight:600}
.medida header h3{font-size:16px;margin:2px 0 0;line-height:1.35}
.medida .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.medida .full{grid-column:1/-1}
@media (max-width:640px){ .medida .grid{grid-template-columns:1fr 1fr} .medida .val{grid-column:1/-1} }
.desc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.full>textarea{display:block;width:100%;margin-top:6px}
.atajos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.atajo{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;min-height:30px;font-size:12.5px;font-weight:600;color:var(--text)}
.atajo .fch{color:var(--muted);font-weight:500}
.atajo:hover{border-color:var(--accent)}
.atajo[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.atajo[aria-pressed="true"] .fch{color:var(--accent)}
.hint.cal{margin:-8px 0 14px;max-width:80ch}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;font-weight:500;cursor:pointer;width:max-content}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
input[type=date]:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Exportar ---------- */
table.res{width:100%;border-collapse:collapse;font-size:15px}
table.res th,table.res td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
table.res td.n,table.res th.n{text-align:right;font-variant-numeric:tabular-nums;width:90px}
table.res tr.tot td{font-weight:800;border-bottom:0}
table.res tr.niv td{font-weight:700;background:var(--surface-2)}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:15px}
.checks li.ok{color:var(--sug)} .checks li.w{color:var(--val)}
.descargas{display:flex;flex-wrap:wrap;gap:10px}
.descargas .btn{flex:1;min-width:200px;min-height:56px;font-size:17px}
.privacidad{font-size:13px;color:var(--muted);margin:0}

/* ---------- Barra inferior ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bottombar .wrap{display:flex;gap:10px;align-items:center}
.bottombar .estado{flex:1;font-size:12.5px;color:var(--muted);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottombar .btn{min-width:120px}
@media (max-width:640px){ .bottombar .estado{display:none} .bottombar .btn{flex:1} }

/* ---------- Diálogos ---------- */
dialog{border:0;padding:0;border-radius:20px;background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,14,25,.5)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.dlg-head{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 8px}
.dlg-head .tt{flex:1}
.dlg-head h2{font-size:19px;line-height:1.3;margin:4px 0 0}
.dlg-body{overflow:auto;padding:4px 18px 12px}
.dlg-body h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.dlg-body p{margin:0 0 8px}
.dlg-body ul{padding-left:20px}
.dlg-body .ejemplo{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.dlg-body .ctxbox{border-left:3px solid var(--border);padding-left:12px;color:var(--muted);font-size:14.5px}
.dlg-body .nota{font-size:13px;color:var(--muted)}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--border)}
.x{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--surface-2)}

/* ---------- Avisos ---------- */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:30;display:flex;align-items:center;gap:14px;background:var(--text);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 24px)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:4px}
footer.pie{font-size:12.5px;color:var(--muted);text-align:center;padding:26px 0 0;border-top:1px solid var(--border);margin-top:28px}
footer.pie p{margin:0 0 4px}
footer.pie a{color:var(--accent);text-underline-offset:2px}

</style>
</head>

  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>

            "Es garanteix un recorregut accessible entre l'entrada, l'aula i la resta d'espais que usa l'alumne/a, s'ubica el grup en espais accessibles i es mantenen lliures d'obstacles els passadissos de l'aula."],
  "III.10": ["La información que debe consultar el alumno/a (horarios, avisos, materiales, perchas o taquillas) se coloca a una altura y en una posición que le permiten alcanzarla de forma autónoma.",
             "La informació que ha de consultar l'alumne/a (horaris, avisos, materials, penjadors o taquilles) es col·loca a una altura i en una posició que li permeten abastar-la de manera autònoma."],
  "III.11": ["El alumno/a dispone de un aseo adaptado cercano a su aula, del tiempo que necesita para usarlo y, si lo precisa, de la supervisión acordada con la familia.",
             "L'alumne/a disposa d'un lavabo adaptat pròxim a la seua aula, del temps que necessita per a usar-lo i, si ho necessita, de la supervisió acordada amb la família."],
  "III.12": ["Se ajustan la mesa, la silla y los utensilios de uso común a las necesidades posturales y de manipulación del alumno/a, siguiendo el asesoramiento de los profesionales especializados.",
             "S'ajusten la taula, la cadira i els utensilis d'ús comú a les necessitats posturals i de manipulació de l'alumne/a, seguint l'assessorament dels professionals especialitzats."],
  "III.14": ["El alumno/a se ubica en el lugar del aula con mejor iluminación y sin reflejos, se controlan la luz natural y la artificial y se evita que tenga que mirar a contraluz.",
             "L'alumne/a s'ubica en el lloc de l'aula amb millor il·luminació i sense reflexos, es controlen la llum natural i l'artificial i s'evita que haja de mirar a contrallum."],
  "III.15": ["El alumno/a se sitúa cerca de las fuentes de información y recibe en formato ampliado o de alto contraste los carteles, las presentaciones y lo que se escribe en la pizarra.",
             "L'alumne/a se situa a prop de les fonts d'informació i rep en format ampliat o d'alt contrast els cartells, les presentacions i el que s'escriu en la pissarra."],
  "III.16": ["El profesorado verbaliza lo que escribe o muestra, nombra a quien interviene y usa señales sonoras constantes para anticipar los cambios de actividad y de espacio.",
             "El professorat verbalitza el que escriu o mostra, anomena qui intervé i usa senyals sonors constants per a anticipar els canvis d'activitat i d'espai."],
  "III.17": ["Se reduce el ruido ambiental del aula (protectores en el mobiliario, ubicación lejos de fuentes de ruido, normas de volumen) y se utilizan los sistemas de ayuda auditiva del alumno/a durante las explicaciones.",
             "Es redueix el soroll ambiental de l'aula (protectors en el mobiliari, ubicació lluny de fonts de soroll, normes de volum) i s'utilitzen els sistemes d'ajuda auditiva de l'alumne/a durant les explicacions."],
  "III.18": ["El alumno/a se sienta donde ve bien la cara de quien habla; el profesorado habla de frente, sin taparse la boca ni ponerse a contraluz, y el grupo respeta los turnos de palabra.",
             "L'alumne/a s'asseu on veu bé la cara de qui parla; el professorat parla de cara, sense tapar-se la boca ni posar-se a contrallum, i el grup respecta els torns de paraula."],
  "III.20": ["Los espacios que usa el alumno/a son estables y previsibles, con zonas de trabajo bien delimitadas, materiales siempre en el mismo lugar y un espacio de calma al que puede acudir cuando lo necesita.",
             "Els espais que usa l'alumne/a són estables i previsibles, amb zones de treball ben delimitades, materials sempre al mateix lloc i un espai de calma on pot anar quan ho necessita."],
  "III.21": ["Las dependencias y los recorridos que utiliza el alumno/a se señalizan con imágenes, pictogramas o códigos de color para que pueda orientarse y desplazarse con autonomía.",
             "Les dependències i els recorreguts que utilitza l'alumne/a se senyalitzen amb imatges, pictogrames o codis de color perquè puga orientar-se i desplaçar-se amb autonomia."],
  "III.22": ["El alumno/a dispone de una agenda o un horario visual; las instrucciones de las tareas se le presentan en pasos cortos con apoyo visual y los cambios de rutina se le anticipan.",
             "L'alumne/a disposa d'una agenda o un horari visual; les instruccions de les tasques se li presenten en passos curts amb suport visual i els canvis de rutina se li anticipen."],
  "III.23": ["Los materiales del grupo se le facilitan en el formato que necesita (digital, ampliado, en lectura fácil, con apoyos visuales o en braille), con la misma información y al mismo tiempo que al resto.",
             "Els materials del grup se li faciliten en el format que necessita (digital, ampliat, en lectura fàcil, amb suports visuals o en braille), amb la mateixa informació i alhora que a la resta."],
  "III.24": ["Antes de cada salida o actividad complementaria se comprueba la accesibilidad, se prevén los apoyos y el transporte necesarios y se anticipa la actividad al alumno/a para que participe en igualdad.",
             "Abans de cada eixida o activitat complementària es comprova l'accessibilitat, es preveuen els suports i el transport necessaris i s'anticipa l'activitat a l'alumne/a perquè hi participe en igualtat."],
  "III.26": ["El centro informa a la familia, o al alumno/a si es mayor de edad, de las becas y ayudas al estudio que le corresponden y le acompaña en la preparación de la solicitud.",
             "El centre informa la família, o l'alumne/a si és major d'edat, de les beques i ajudes a l'estudi que li corresponen i l'acompanya en la preparació de la sol·licitud."],
  "III.27": ["Se informa a la familia de la ayuda de comedor y se le orienta en su tramitación, también cuando su situación cambia a lo largo del curso.",
             "S'informa la família de l'ajuda de menjador i se l'orienta en la tramitació, també quan la seua situació canvia al llarg del curs."],
  "III.28": ["Se gestiona el transporte escolar o la ayuda correspondiente y se organizan la llegada y la salida del alumno/a para que no pierda tiempo lectivo.",
             "Es gestiona el transport escolar o l'ajuda corresponent i s'organitzen l'arribada i l'eixida de l'alumne/a perquè no perda temps lectiu."],
  "III.29": ["«Otros: banco de libros y préstamo de material escolar o de un dispositivo del centro».",
             "«Altres: banc de llibres i préstec de material escolar o d'un dispositiu del centre»."],
  "III.31": ["Ante una situación grave de convivencia, el equipo directivo solicita el asesoramiento de la Unidad de Atención e Intervención y aplica las medidas de protección e intervención acordadas.",
             "Davant d'una situació greu de convivència, l'equip directiu sol·licita l'assessorament de la Unitat d'Atenció i Intervenció i aplica les mesures de protecció i intervenció acordades."],
  "III.32": ["El centro ordinario y el centro de educación especial coordinan periódicamente los objetivos, las estrategias y el seguimiento del alumno/a, por ejemplo en una escolarización combinada.",
             "El centre ordinari i el centre d'educació especial coordinen periòdicament els objectius, les estratègies i el seguiment de l'alumne/a, per exemple en una escolarització combinada."],
  "III.33": ["Mientras el alumno/a está atendido en la unidad, el equipo docente mantiene la coordinación sobre su plan de trabajo y se planifica con antelación un retorno progresivo y acompañado al centro.",
             "Mentre l'alumne/a és atés en la unitat, l'equip docent manté la coordinació sobre el seu pla de treball i es planifica amb antelació un retorn progressiu i acompanyat al centre."],
  "III.34": ["Durante la hospitalización, el equipo docente acuerda con el profesorado hospitalario un plan de trabajo con los aprendizajes esenciales y se mantiene el contacto del alumno/a con su grupo.",
             "Durant l'hospitalització, l'equip docent acorda amb el professorat hospitalari un pla de treball amb els aprenentatges essencials i es manté el contacte de l'alumne/a amb el seu grup."],
  "III.35": ["El servicio de orientación del centro solicita al SEO asesoramiento especializado para un caso complejo y se acuerda con el equipo docente un plan de intervención con seguimiento periódico.",
             "El servei d'orientació del centre sol·licita al SEO assessorament especialitzat per a un cas complex i s'acorda amb l'equip docent un pla d'intervenció amb seguiment periòdic."],
  "III.36": ["«Otros: coordinación con el profesorado de atención educativa domiciliaria».",
             "«Altres: coordinació amb el professorat d'atenció educativa domiciliària»."],
  "III.38": ["El tutor o la tutora y el servicio de orientación se coordinan periódicamente con los servicios sociales municipales para hacer el seguimiento de la situación del alumno/a y del apoyo a la familia.",
             "El tutor o la tutora i el servei d'orientació es coordinen periòdicament amb els serveis socials municipals per a fer el seguiment de la situació de l'alumne/a i del suport a la família."],
  "III.39": ["El centro y el equipo especializado que interviene con la familia acuerdan indicadores de seguimiento (asistencia, cuidado, estado emocional) y una vía de comunicación periódica.",
             "El centre i l'equip especialitzat que intervé amb la família acorden indicadors de seguiment (assistència, cura, estat emocional) i una via de comunicació periòdica."],
  "III.40": ["Las entrevistas y comunicaciones importantes con la familia se realizan con la ayuda de una persona mediadora o intérprete, que también facilita la comprensión del funcionamiento del centro.",
             "Les entrevistes i comunicacions importants amb la família es fan amb l'ajuda d'una persona mediadora o intèrpret, que també facilita la comprensió del funcionament del centre."],
  "III.41": ["Con el consentimiento de la familia, el centro comparte con los servicios sanitarios la información relevante observada en el aula y se coordinan las pautas que afectan a la jornada escolar.",
             "Amb el consentiment de la família, el centre comparteix amb els serveis sanitaris la informació rellevant observada a l'aula i es coordinen les pautes que afecten la jornada escolar."],
  "III.42": ["El profesorado y los profesionales de atención temprana comparten objetivos y estrategias para trabajarlos de manera coherente en el centro, en casa y en las sesiones de intervención.",
             "El professorat i els professionals d'atenció primerenca comparteixen objectius i estratègies per a treballar-los de manera coherent al centre, a casa i en les sessions d'intervenció."],
  "III.43": ["Con autorización de la familia, el centro facilita a la unidad de salud mental la información que solicita sobre el funcionamiento del alumno/a en el aula y ajusta las pautas educativas a sus orientaciones.",
             "Amb autorització de la família, el centre facilita a la unitat de salut mental la informació que sol·licita sobre el funcionament de l'alumne/a a l'aula i ajusta les pautes educatives a les seues orientacions."],
  "III.44": ["Ante indicios de un uso problemático de sustancias, pantallas o juego, se orienta a la familia hacia la unidad de prevención y se coordinan con ella actuaciones preventivas en el centro.",
             "Davant d'indicis d'un ús problemàtic de substàncies, pantalles o joc, s'orienta la família cap a la unitat de prevenció i es coordinen amb ella actuacions preventives al centre."],
  "III.45": ["Se mantiene una coordinación regular con el equipo técnico responsable de la medida de protección y se acuerda qué información escolar se comparte, con quién y por qué vía.",
             "Es manté una coordinació regular amb l'equip tècnic responsable de la mesura de protecció i s'acorda quina informació escolar es comparteix, amb qui i per quina via."],
  "III.46": ["El centro se coordina con la entidad que atiende al alumno/a o a su familia para compartir objetivos y dar coherencia a los apoyos que recibe dentro y fuera del horario escolar.",
             "El centre es coordina amb l'entitat que atén l'alumne/a o la seua família per a compartir objectius i donar coherència als suports que rep dins i fora de l'horari escolar."],
  "III.47": ["«Otros: coordinación con el servicio privado de logopedia o psicopedagogía al que asiste».",
             "«Altres: coordinació amb el servei privat de logopèdia o psicopedagogia on va»."],

  /* ============ MEDIDAS PERSONALIZADAS PARA LA PARTICIPACIÓN ============ */
  "III.49": ["El tutor o la tutora mantiene con el alumno/a una entrevista breve y periódica para revisar su organización, sus avances y su bienestar, y acordar objetivos concretos hasta la siguiente sesión.",
             "El tutor o la tutora manté amb l'alumne/a una entrevista breu i periòdica per a revisar la seua organització, els seus avanços i el seu benestar, i acordar objectius concrets fins a la sessió següent."],
  "III.50": ["Un compañero/a formado para ello acompaña al alumno/a en momentos o tareas acordados (organización, trabajo en el aula, recreo) y el tutor o la tutora revisa periódicamente cómo funciona.",
             "Un company/a format per a fer-ho acompanya l'alumne/a en moments o tasques acordats (organització, treball a l'aula, esbarjo) i el tutor o la tutora revisa periòdicament com funciona."],
  "III.51": ["Familia, tutor/a y alumno/a firman un compromiso con pocos objetivos concretos y observables, lo que hará cada parte y la forma y la frecuencia del seguimiento.",
             "Família, tutor/a i alumne/a signen un compromís amb pocs objectius concrets i observables, el que farà cada part i la manera i la freqüència del seguiment."],
  "III.52": ["El alumno/a participa, individualmente o en pequeño grupo, en sesiones periódicas para identificar y regular sus emociones y practicar habilidades sociales, con pautas que se trasladan al aula y a la familia.",
             "L'alumne/a participa, individualment o en grup reduït, en sessions periòdiques per a identificar i regular les seues emocions i practicar habilitats socials, amb pautes que es traslladen a l'aula i a la família."],
  "III.53": ["Una persona adulta de referencia acompaña al alumno/a en los momentos que le resultan más difíciles (entradas, cambios de actividad, recreos, conflictos) y le ayuda a anticipar y organizar la jornada.",
             "Una persona adulta de referència acompanya l'alumne/a en els moments que li resulten més difícils (entrades, canvis d'activitat, esbarjos, conflictes) i l'ajuda a anticipar i organitzar la jornada."],
  "III.54": ["A su llegada se realizan la entrevista con la familia, la visita al centro, la evaluación inicial y la asignación de un compañero/a de acogida, y se revisa su adaptación durante las primeras semanas.",
             "A la seua arribada es fan l'entrevista amb la família, la visita al centre, l'avaluació inicial i l'assignació d'un company/a d'acollida, i es revisa la seua adaptació durant les primeres setmanes."],
  "III.55": ["Se activa el protocolo de acoso: se protege a la víctima con medidas de vigilancia y una persona de referencia, se interviene con quien agrede y con el grupo, y se informa a las familias.",
             "S'activa el protocol d'assetjament: es protegeix la víctima amb mesures de vigilància i una persona de referència, s'intervé amb qui agredeix i amb el grup, i s'informa les famílies."],
  "III.56": ["Ante indicios de maltrato se cumplimenta la hoja de notificación, se comunica a los servicios correspondientes y se ofrece al alumno/a un espacio seguro y una persona de referencia en el centro.",
             "Davant d'indicis de maltractament s'emplena el full de notificació, es comunica als serveis corresponents i s'ofereix a l'alumne/a un espai segur i una persona de referència al centre."],
  "III.57": ["Se aplica el protocolo correspondiente, el centro se coordina con los servicios especializados, se garantiza la confidencialidad y se ofrece acompañamiento al alumno/a; si es necesario, se interviene con quien ejerce la violencia.",
             "S'aplica el protocol corresponent, el centre es coordina amb els serveis especialitzats, es garanteix la confidencialitat i s'ofereix acompanyament a l'alumne/a; si cal, s'intervé amb qui exerceix la violència."],
  "III.58": ["Ante cualquier otra situación de violencia o discriminación se aplica el protocolo vigente, se protege al alumno/a afectado, se interviene con las personas implicadas y se trabaja el respeto con el grupo.",
             "Davant de qualsevol altra situació de violència o discriminació s'aplica el protocol vigent, es protegeix l'alumne/a afectat, s'intervé amb les persones implicades i es treballa el respecte amb el grup."],
  "III.59": ["«Otros: orientación académica y profesional personalizada».",
             "«Altres: orientació acadèmica i professional personalitzada»."],

  /* ================= MEDIDAS DE FLEXIBILIZACIÓN ================= */
  "III.61": ["La permanencia se acompaña de un plan específico que parte del análisis de las dificultades del curso anterior, concreta los apoyos y prevé revisiones periódicas con el alumno/a y la familia.",
             "La permanència s'acompanya d'un pla específic que parteix de l'anàlisi de les dificultats del curs anterior, concreta els suports i preveu revisions periòdiques amb l'alumne/a i la família."],

  /* ================= MEDIDAS DE APRENDIZAJE ================= */
  "III.64": ["El alumno/a puede presentar el producto final en otro formato (oral, visual, digital o manipulativo) o con otra extensión, siempre que muestre los aprendizajes esenciales del proyecto.",
             "L'alumne/a pot presentar el producte final en un altre format (oral, visual, digital o manipulatiu) o amb una altra extensió, sempre que mostre els aprenentatges essencials del projecte."],
  "III.65": ["Se le ubica cerca del docente, se le dan las instrucciones de una en una comprobando que las ha entendido, se le ofrece modelado y práctica guiada y se refuerzan sus logros de forma inmediata.",
             "Se l'ubica a prop del docent, se li donen les instruccions d'una en una comprovant que les ha enteses, se li ofereix modelatge i pràctica guiada i se'n reforcen els èxits de manera immediata."],
  "III.66": ["Las actividades se ajustan en cantidad, complejidad o tiempo, priorizando las que trabajan los aprendizajes esenciales, y se le permiten distintas formas de respuesta.",
             "Les activitats s'ajusten en quantitat, complexitat o temps, prioritzant les que treballen els aprenentatges essencials, i se li permeten diferents formes de resposta."],
  "III.67": ["Dispone de materiales de apoyo personalizados (esquemas, glosarios visuales, guías de pasos, versiones simplificadas o material manipulativo) para seguir la programación común.",
             "Disposa de materials de suport personalitzats (esquemes, glossaris visuals, guies de passos, versions simplificades o material manipulatiu) per a seguir la programació comuna."],
  "III.68": ["En las pruebas se adaptan el formato y las condiciones: enunciados claros y separados, lectura en voz alta de las preguntas, más tiempo, un espacio tranquilo o la posibilidad de responder oralmente.",
             "En les proves s'adapten el format i les condicions: enunciats clars i separats, lectura en veu alta de les preguntes, més temps, un espai tranquil o la possibilitat de respondre oralment."],
  "III.69": ["En las salidas y celebraciones se le anticipa lo que va a ocurrir, se le asigna un papel que puede desempeñar con éxito y se prevé el apoyo que necesitará.",
             "En les eixides i celebracions se li anticipa el que passarà, se li assigna un paper que pot exercir amb èxit i es preveu el suport que necessitarà."],
  "III.71": ["En ESO, el alumno/a cursa una materia de libre configuración orientada al refuerzo de las competencias en las que presenta más dificultades, en lugar de otra optativa.",
             "En ESO, l'alumne/a cursa una matèria de lliure configuració orientada al reforç de les competències en què presenta més dificultats, en lloc d'una altra optativa."],
  "III.72": ["El alumno/a participa en sesiones periódicas en pequeño grupo centradas en la comprensión y la expresión oral en la lengua extranjera, con situaciones comunicativas funcionales.",
             "L'alumne/a participa en sessions periòdiques en grup reduït centrades en la comprensió i l'expressió oral en la llengua estrangera, amb situacions comunicatives funcionals."],
  "III.73": ["Cuando el grupo se desdobla, el alumno/a se integra en el subgrupo que trabaja los mismos aprendizajes con más apoyos y una atención más individualizada.",
             "Quan el grup es desdobla, l'alumne/a s'integra en el subgrup que treballa els mateixos aprenentatges amb més suports i una atenció més individualitzada."],
  "III.74": ["En las sesiones acordadas, un segundo docente apoya al alumno/a dentro de su aula, sin separarlo del grupo, para que pueda seguir la actividad común.",
             "En les sessions acordades, un segon docent dona suport a l'alumne/a dins de la seua aula, sense separar-lo del grup, perquè puga seguir l'activitat comuna."],
  "III.75": ["Durante un periodo limitado, el alumno/a asiste en horario lectivo a un pequeño grupo de refuerzo con objetivos concretos, y al final de cada periodo se revisa si continúa.",
             "Durant un període limitat, l'alumne/a assisteix en horari lectiu a un grup reduït de reforç amb objectius concrets, i al final de cada període es revisa si hi continua."],
  "III.76": ["El alumno/a sigue un plan de recuperación de las materias pendientes con actividades secuenciadas, entregas periódicas y un docente de referencia que le orienta.",
             "L'alumne/a segueix un pla de recuperació de les matèries pendents amb activitats seqüenciades, lliuraments periòdics i un docent de referència que l'orienta."],
  "III.77": ["El alumno/a participa fuera del horario lectivo en el programa de refuerzo cofinanciado del centro, y su profesorado se coordina con el del programa sobre los aprendizajes que conviene reforzar.",
             "L'alumne/a participa fora de l'horari lectiu en el programa de reforç cofinançat del centre, i el seu professorat es coordina amb el del programa sobre els aprenentatges que convé reforçar."],
  "III.78": ["El alumno/a participa en un taller en pequeño grupo en el que se refuerzan aprendizajes básicos mediante tareas prácticas y funcionales.",
             "L'alumne/a participa en un taller en grup reduït en què es reforcen aprenentatges bàsics mitjançant tasques pràctiques i funcionals."],
  "III.79": ["El alumno/a participa en un taller de ampliación en el que profundiza en sus áreas de interés mediante retos e investigaciones, y comparte el resultado con su grupo.",
             "L'alumne/a participa en un taller d'ampliació en què aprofundeix en les seues àrees d'interés mitjançant reptes i investigacions, i comparteix el resultat amb el seu grup."],
  "III.80": ["«Otros: programa de entrenamiento de funciones ejecutivas en pequeño grupo».",
             "«Altres: programa d'entrenament de funcions executives en grup reduït»."],
  "III.82": ["El alumno/a que conoce el castellano pero no el valenciano recibe sesiones intensivas de valenciano, centradas primero en la comunicación oral y el vocabulario escolar, durante el tiempo necesario para seguir las clases.",
             "L'alumne/a que coneix el castellà però no el valencià rep sessions intensives de valencià, centrades primer en la comunicació oral i el vocabulari escolar, durant el temps necessari per a seguir les classes."],
  "III.83": ["El alumno/a que no conoce ninguna de las lenguas oficiales recibe atención lingüística intensiva y se incorpora progresivamente a las actividades de su grupo, empezando por las de menor carga lingüística.",
             "L'alumne/a que no coneix cap de les llengües oficials rep atenció lingüística intensiva i s'incorpora progressivament a les activitats del seu grup, començant per les de menys càrrega lingüística."],
  "III.85": ["El alumno/a tiene prioridad para elegir el turno u horario que le permite compatibilizar los estudios con los entrenamientos.",
             "L'alumne/a té prioritat per a triar el torn o l'horari que li permet compatibilitzar els estudis amb els entrenaments."],
  "III.86": ["Se asigna al alumno/a al grupo cuyo horario facilita su asistencia a entrenamientos y competiciones.",
             "S'assigna l'alumne/a al grup l'horari del qual facilita la seua assistència a entrenaments i competicions."],
  "III.87": ["Las ausencias por entrenamientos y competiciones se justifican con la documentación oficial y el alumno/a recibe un plan para recuperar los aprendizajes de esos días.",
             "Les absències per entrenaments i competicions es justifiquen amb la documentació oficial i l'alumne/a rep un pla per a recuperar els aprenentatges d'aquells dies."],

<script>
/* Exportación e importación del Excel.
   Se parte de la plantilla original (incrustada en base64) y se escriben los datos
   directamente en el XML de cada hoja, de modo que se conservan formatos, listas
   desplegables, formato condicional y fórmulas. También se guardan los valores ya
   calculados de las fórmulas para que el archivo se vea bien en visores que no
   recalculan (Vista Previa, móviles…); Excel vuelve a calcular todo al abrirlo. */
window.XLSXIO = (function () {
  "use strict";
  const NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const NS_R = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const NS_XML = "http://www.w3.org/XML/1998/namespace";
  const MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

  const parse = s => new DOMParser().parseFromString(s, "application/xml");
  const ser = d => { const s = new XMLSerializer().serializeToString(d); return s.startsWith("<?xml") ? s : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + s; };
  const colNum = ref => { let n = 0; for (const ch of ref.match(/^[A-Z]+/)[0]) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
  const hijos = (el, tag) => Array.from(el.childNodes).filter(n => n.nodeType === 1 && n.localName === tag);

  function b64ToBytes(b64) {
    const bin = atob(b64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  const isoASerie = iso => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000 + 25569; };
  const serieAIso = n => new Date(Math.round((n - 25569) * 86400000)).toISOString().slice(0, 10);
  const hoySerie = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000 + 25569; };

  async function rutasHojas(zip) {
    const wb = parse(await zip.file("xl/workbook.xml").async("string"));
    const rels = parse(await zip.file("xl/_rels/workbook.xml.rels").async("string"));
    const destino = {};
    for (const r of rels.getElementsByTagName("Relationship")) destino[r.getAttribute("Id")] = r.getAttribute("Target");
    const hojas = [];
    for (const s of wb.getElementsByTagNameNS(NS, "sheet")) {
      let ruta = destino[s.getAttributeNS(NS_R, "id")].replace(/^\//, "");
      if (!ruta.startsWith("xl/")) ruta = "xl/" + ruta;
      hojas.push({nombre: s.getAttribute("name"), ruta});
    }
    // Identificación por nombre (castellano o valenciano) y, si no, por posición.
    const busca = (re, i) => (hojas.find(h => re.test(h.nombre)) || hojas[i] || {}).ruta;
    return {
      alumno: busca(/^alumn/i, 0), II: busca(/^nivell?\s*ii$/i, 1),
      III: busca(/^nivell?\s*iii$/i, 2), resumen: busca(/^resum/i, 3)
    };
  }

  /* ---------- Edición de una hoja ---------- */
  class Hoja {
    constructor(xml) {
      this.doc = parse(xml);
      this.datos = this.doc.getElementsByTagNameNS(NS, "sheetData")[0];
      this.filas = new Map();
      for (const r of hijos(this.datos, "row")) this.filas.set(+r.getAttribute("r"), r);
    }
    el(tag) { return this.doc.createElementNS(NS, tag); }
    fila(n) {
      let r = this.filas.get(n);
      if (r) return r;
      r = this.el("row"); r.setAttribute("r", n);
      let sig = null;
      for (const [k, el] of this.filas) if (k > n && (!sig || k < +sig.getAttribute("r"))) sig = el;
      this.datos.insertBefore(r, sig);
      this.filas.set(n, r);
      return r;
    }
    celda(ref, crear = true) {
      const fila = +ref.match(/\d+/)[0], r = crear ? this.fila(fila) : this.filas.get(fila);
      if (!r) return null;
      const cs = hijos(r, "c");
      const c0 = cs.find(c => c.getAttribute("r") === ref);
      if (c0 || !crear) return c0 || null;
      const c = this.el("c"); c.setAttribute("r", ref);
      r.insertBefore(c, cs.find(x => colNum(x.getAttribute("r")) > colNum(ref)) || null);
      return c;
    }
    vaciar(c, conFormula) {
      for (const h of hijos(c, "v").concat(hijos(c, "is"), conFormula ? hijos(c, "f") : [])) c.removeChild(h);
    }
    texto(ref, s) {
      const c = this.celda(ref);
      this.vaciar(c, true);
      if (s === null || s === undefined || s === "") { c.removeAttribute("t"); return; }
      c.setAttribute("t", "inlineStr");
      const is = this.el("is"), tt = this.el("t");
      tt.setAttributeNS(NS_XML, "xml:space", "preserve");
      tt.textContent = s;
      is.appendChild(tt); c.appendChild(is);
    }
    numero(ref, n) {
      const c = this.celda(ref);
      this.vaciar(c, true);
      c.removeAttribute("t");
      if (n === null || n === undefined || n === "") return;
      const v = this.el("v"); v.textContent = String(n); c.appendChild(v);
    }
    /* Valor ya calculado de una celda con fórmula (se conserva la fórmula). */
    cache(ref, val) {
      const c = this.celda(ref, false);
      if (!c || !hijos(c, "f").length) return;
      this.vaciar(c, false);
      const v = this.el("v");
      if (typeof val === "number") { c.removeAttribute("t"); v.textContent = String(val); }
      else { c.setAttribute("t", "str"); v.textContent = val == null ? "" : String(val); }
      c.appendChild(v);
    }
    xml() { return ser(this.doc); }
  }

  /* ================= Exportar ================= */
  async function exportar({estado: S, modelo: M, lang}) {
    const va = lang === "va";
    const tr = s => (va && s ? (M.dicc[s] || s) : s);
    const VAL = {}; window.VALORACIONES.forEach(v => { VAL[v.k] = v[lang]; });
    const otrosTxt = spec => (va ? "Altres: " : "Otros: ") + spec;
    const zip = await JSZip.loadAsync(b64ToBytes(window.PLANTILLA_XLSX_B64));
    const R = await rutasHojas(zip);
    const H = {};
    for (const k of ["alumno", "II", "III", "resumen"]) H[k] = new Hoja(await zip.file(R[k]).async("string"));
    const a = S.alumno;

    /* Hoja Alumno */
    H.alumno.texto("C5", a.nombre); H.alumno.texto("C6", a.curso); H.alumno.texto("C7", a.grupo);
    H.alumno.texto("C8", a.cursoEsc); H.alumno.texto("C9", a.tutor);

    /* Hojas Nivel II / Nivel III */
    const aplicadas = {II: [], III: []};   // en orden de fila
    const textoCelda = {};                  // id -> {c, d} tal como quedan en la hoja
    for (const niv of ["II", "III"]) {
      const h = H[niv];
      for (const n of M.items.filter(x => x.nivel === niv)) {
        const s = S.sel[n.id];
        let c = tr(n.c), d = tr(n.d);
        if (s) {
          const r = n.r;
          if (n.otros && s.otros.trim()) {
            if (n.d) { d = otrosTxt(s.otros.trim()); h.texto("D" + r, d); }
            else { c = otrosTxt(s.otros.trim()); h.texto("C" + r, c); }
          }
          h.texto("E" + r, "Sí");
          h.numero("F" + r, s.fi ? isoASerie(s.fi) : "");
          h.numero("G" + r, s.ff ? isoASerie(s.ff) : "");
          h.texto("H" + r, s.desc);
          h.texto("I" + r, s.val ? VAL[s.val] : "");
          h.texto("J" + r, s.res);
          aplicadas[niv].push(n);
        }
        textoCelda[n.id] = {c, d};
      }
      // Valores calculados de la cabecera y de la numeración (columna K)
      h.cache("C3", a.nombre || "");
      h.cache("F3", a.curso ? a.curso + (a.grupo ? " - " + a.grupo : "") : "");
      h.cache("H3", (va ? "Curs escolar: " : "Curso escolar: ") + (a.cursoEsc || ""));
      let k = 0;
      for (const n of M.items.filter(x => x.nivel === niv)) h.cache("K" + n.r, S.sel[n.id] ? ++k : "");
    }

    /* Hoja Alumno: recuento por bloque (filas 14-22) */
    const bloques = [];
    for (const niv of ["II", "III"]) for (const b of M.niveles[niv]) bloques.push(b.nodos.filter(n => n.tipo === "item" && S.sel[n.id]).length);
    bloques.forEach((v, i) => H.alumno.cache("C" + (14 + i), v));
    H.alumno.cache("C" + (14 + bloques.length), aplicadas.II.length + aplicadas.III.length);

    /* Hoja Resumen */
    const n2 = aplicadas.II.length, n3 = aplicadas.III.length, tot = n2 + n3, rs = H.resumen;
    rs.cache("C3", a.nombre || ""); rs.cache("F3", a.curso || ""); rs.cache("H3", a.grupo || "");
    rs.cache("C4", a.tutor || ""); rs.cache("G4", a.cursoEsc || "");
    rs.cache("C5", n2); rs.cache("D5", n3); rs.cache("E5", tot); rs.cache("H5", hoySerie());
    rs.cache("K5", n2); rs.cache("K6", n3);
    const lista = aplicadas.II.concat(aplicadas.III);
    for (let k = 1; k <= 126; k++) {
      const r = 7 + k, n = lista[k - 1];
      if (!rs.celda("L" + r, false)) break;
      if (!n) {
        ["A", "B", "C", "D", "E", "F", "G", "H", "I", "L"].forEach(col => rs.cache(col + r, ""));
        if (k === 1 && tot === 0) rs.cache("G8", va ? "No hi ha cap mesura marcada com a aplicada (S'aplica? = Sí)." : "No hay medidas marcadas como aplicadas (¿Aplica? = Sí).");
        continue;
      }
      const s = S.sel[n.id], tc = textoCelda[n.id];
      rs.cache("A" + r, k);
      rs.cache("B" + r, (va ? "Nivell " : "Nivel ") + n.nivel);
      rs.cache("C" + r, tr(n.bloque));
      rs.cache("D" + r, n.nivel === "II" ? tc.c : tc.c + (tc.d ? " › " + tc.d : ""));
      rs.cache("E" + r, s.fi ? isoASerie(s.fi) : "");
      rs.cache("F" + r, s.ff ? isoASerie(s.ff) : "");
      rs.cache("G" + r, s.desc || "");
      rs.cache("H" + r, s.val ? VAL[s.val] : "");
      rs.cache("I" + r, s.res || "");
      rs.cache("L" + r, n.r);
    }

    /* Serializar hojas (y traducir nombres de hoja y literales de fórmulas si es valenciano) */
    const vaFormulas = xml => {
      for (const [es, v] of Object.entries(window.XLSX_VA_HOJAS)) {
        xml = xml.split(`'${es}'!`).join(`'${v}'!`).split(`${es}!`).join(`${v}!`);
      }
      for (const [es, v] of window.XLSX_VA_FORMULAS) xml = xml.split(es).join(v).split(es.replace(/"/g, "&quot;")).join(v.replace(/"/g, "&quot;"));
      return xml;
    };
    for (const k of Object.keys(H)) {
      let xml = H[k].xml();
      if (va) xml = vaFormulas(xml);
      zip.file(R[k], xml, {createFolders: false});
    }

    /* Libro: forzar recálculo al abrir; traducir nombres de hoja */
    let wb = await zip.file("xl/workbook.xml").async("string");
    if (/<calcPr\b/.test(wb)) wb = wb.replace(/<calcPr\b([^>]*?)\s*(\/?)>/, (m, at, cierre) => `<calcPr${at.replace(/\s*fullCalcOnLoad="[^"]*"/, "")} fullCalcOnLoad="1"${cierre ? "/" : ""}>`);
    else wb = wb.replace("</workbook>", '<calcPr fullCalcOnLoad="1"/></workbook>');
    if (va) {
      for (const [es, v] of Object.entries(window.XLSX_VA_HOJAS)) wb = wb.split(`name="${es}"`).join(`name="${v}"`);
      wb = vaFormulas(wb);
      const app = zip.file("docProps/app.xml");
      if (app) {
        let ax = await app.async("string");
        for (const [es, v] of Object.entries(window.XLSX_VA_HOJAS)) ax = ax.split(`>${es}<`).join(`>${v}<`);
        zip.file("docProps/app.xml", ax, {createFolders: false});
      }
      /* Textos compartidos (rótulos fijos y de las medidas) */
      const sstF = zip.file("xl/sharedStrings.xml");
      if (sstF) {
        const sd = parse(await sstF.async("string"));
        for (const si of Array.from(sd.getElementsByTagNameNS(NS, "si"))) {
          const actual = Array.from(si.getElementsByTagNameNS(NS, "t")).map(x => x.textContent).join("");
          const nuevo = M.dicc[actual];
          if (!nuevo || nuevo === actual) continue;
          while (si.firstChild) si.removeChild(si.firstChild);
          const tt = sd.createElementNS(NS, "t");
          tt.setAttributeNS(NS_XML, "xml:space", "preserve");
          tt.textContent = nuevo;
          si.appendChild(tt);
        }
        zip.file("xl/sharedStrings.xml", ser(sd), {createFolders: false});
      }
    }
    zip.file("xl/workbook.xml", wb, {createFolders: false});
    // La cadena de cálculo se regenera sola; quitarla evita avisos de reparación.
    if (zip.file("xl/calcChain.xml")) {
      zip.remove("xl/calcChain.xml");
      const ct = await zip.file("[Content_Types].xml").async("string");
      zip.file("[Content_Types].xml", ct.replace(/<Override[^>]*calcChain[^>]*\/>/, ""), {createFolders: false});
      const rels = await zip.file("xl/_rels/workbook.xml.rels").async("string");
      zip.file("xl/_rels/workbook.xml.rels", rels.replace(/<Relationship[^>]*calcChain[^>]*\/>/, ""), {createFolders: false});
    }
    return zip.generateAsync({type: "blob", mimeType: MIME, compression: "DEFLATE"});
  }

  /* ================= Importar ================= */
  async function importar(buf, M) {
    const zip = await JSZip.loadAsync(buf);
    const R = await rutasHojas(zip);
    if (!R.II || !R.III || !zip.file(R.II) || !zip.file(R.III)) throw new Error("Hojas no encontradas");
    const sst = [];
    const sstF = zip.file("xl/sharedStrings.xml");
    if (sstF) {
      const sd = parse(await sstF.async("string"));
      for (const si of sd.getElementsByTagNameNS(NS, "si")) sst.push(Array.from(si.getElementsByTagNameNS(NS, "t")).map(x => x.textContent).join(""));
    }
    async function leer(ruta) {
      const vals = {};
      if (!ruta || !zip.file(ruta)) return vals;
      const d = parse(await zip.file(ruta).async("string"));
      for (const c of d.getElementsByTagNameNS(NS, "c")) {
        const tp = c.getAttribute("t"), v = hijos(c, "v")[0];
        let val;
        if (tp === "s" && v) val = sst[+v.textContent];
        else if (tp === "inlineStr") val = Array.from(c.getElementsByTagNameNS(NS, "t")).map(x => x.textContent).join("");
        else if (tp === "str" || tp === "e") val = v ? v.textContent : "";
        else if (tp === "b") val = v && v.textContent === "1";
        else if (v && v.textContent !== "") val = Number(v.textContent);
        if (val !== undefined && val !== "") vals[c.getAttribute("r")] = val;
      }
      return vals;
    }
    const txt = v => (v === undefined || v === null ? "" : String(v)).trim();
    const fecha = v => {
      if (typeof v === "number" && v > 20000 && v < 80000) return serieAIso(v);
      const m = txt(v).match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);
      if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
      return /^\d{4}-\d{2}-\d{2}$/.test(txt(v)) ? txt(v) : "";
    };
    const valor = v => {
      const s = txt(v).toLowerCase();
      const f = window.VALORACIONES.find(x => x.es.toLowerCase() === s || x.va.toLowerCase() === s);
      return f ? f.k : "";
    };
    const al = await leer(R.alumno);
    const estado = {
      alumno: {nombre: txt(al.C5), curso: txt(al.C6), grupo: txt(al.C7), cursoEsc: txt(al.C8), tutor: txt(al.C9)},
      sel: {}, ultima: {fi: "", ff: ""}
    };
    for (const niv of ["II", "III"]) {
      const h = await leer(R[niv]);
      for (const n of M.items.filter(x => x.nivel === niv)) {
        const r = n.r;
        if (!/^s[ií]$/i.test(txt(h["E" + r])) && txt(h["E" + r]).toLowerCase() !== "x") continue;
        let otros = "";
        if (n.otros) {
          const m = txt(h[(n.d ? "D" : "C") + r]).match(/^(otros|altres)\b[^:]*:\s*(.+)$/i);
          if (m) otros = m[2].trim();
        }
        const fi = fecha(h["F" + r]), ff = fecha(h["G" + r]);
        estado.sel[n.id] = {fi, ff, desc: txt(h["H" + r]), val: valor(h["I" + r]), res: txt(h["J" + r]), otros, src: {fi: null, ff: null},
          // Aplicada con fecha de inicio y sin fecha de fin: se conserva así al reabrir.
          sinFin: !!fi && !ff};
        if (fi && !estado.ultima.fi) estado.ultima.fi = fi;
        if (ff && !estado.ultima.ff) estado.ultima.ff = ff;
      }
    }
    return estado;
  }

  return {exportar, importar};
})();

</script>
<script>
/* Generación del PDF con las medidas elegidas (jsPDF + AutoTable). */
window.PDFGEN = (function () {
  "use strict";
  const NAVY = [29, 58, 122], GRIS = [90, 99, 119], SUAVE = [238, 241, 247], LINEA = [216, 222, 234];

  /* Las fuentes estándar de PDF solo cubren Latin-1: se normalizan los caracteres tipográficos. */
  const lat = s => String(s ?? "")
    .replace(/[‘’‚′]/g, "'").replace(/[“”„″]/g, '"')
    .replace(/[–—−]/g, "-").replace(/…/g, "...").replace(/›/g, ">").replace(/‹/g, "<")
    .replace(/€/g, "EUR").replace(/[•●]/g, "·").replace(/ | /g, " ")
    .replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, "");
  const fmt = iso => (iso ? iso.split("-").reverse().join("/") : "");

  async function generar({estado: S, modelo: M, lang, centro}) {
    const va = lang === "va";
    const T = window.I18N[lang];
    const VAL = {}; window.VALORACIONES.forEach(v => { VAL[v.k] = v[lang]; });
    const etq = n => {
      const s = va ? n.va : n.es;
      return s === s.toUpperCase() && /[A-ZÁÉÍÓÚ]{4}/.test(s) ? s.charAt(0) + s.slice(1).toLowerCase() : s;
    };
    const a = S.alumno;
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation: "landscape", unit: "mm", format: "a4", compress: true});
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), MX = 14;
    doc.setProperties({title: lat(va ? "Mesures de nivell II i III" : "Medidas de nivel II y III") + (a.nombre ? " - " + lat(a.nombre) : ""),
      subject: "ITACA 3", creator: "Medidas II y III"});

    /* Cabecera */
    doc.setFillColor(...NAVY); doc.rect(0, 0, W, 4, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(...NAVY);
    doc.text(lat(va ? "Mesures de resposta educativa per a la inclusió · Nivells II i III" : "Medidas de respuesta educativa para la inclusión · Niveles II y III"), MX, 16);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...GRIS);
    doc.text(lat([centro, "ITACA 3"].filter(Boolean).join(" · ")), MX, 22);

    const L = T;
    doc.autoTable({
      startY: 27, margin: {left: MX, right: MX}, theme: "grid",
      styles: {font: "helvetica", fontSize: 9.5, cellPadding: 2.2, lineColor: LINEA, lineWidth: 0.2, textColor: [19, 26, 43]},
      columnStyles: {0: {fontStyle: "bold", fillColor: SUAVE, cellWidth: 34}, 2: {fontStyle: "bold", fillColor: SUAVE, cellWidth: 28}, 4: {fontStyle: "bold", fillColor: SUAVE, cellWidth: 28}},
      body: [
        [lat(va ? "Alumne/a" : "Alumno/a"), {content: lat(a.nombre), colSpan: 5}],
        [lat(L.fCurso), lat(a.curso), lat(L.fGrupo), lat(a.grupo), lat(L.fCursoEsc), lat(a.cursoEsc)],
        [lat(L.fTutor), {content: lat(a.tutor), colSpan: 5}]
      ]
    });

    /* Resumen */
    const sel = M.items.filter(n => S.sel[n.id]);
    const n2 = sel.filter(n => n.nivel === "II").length, n3 = sel.length - n2;
    let y = doc.lastAutoTable.finalY + 7;
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...NAVY);
    doc.text(lat(va ? `Mesures aplicades: nivell II · ${n2}   |   nivell III · ${n3}   |   total · ${sel.length}`
      : `Medidas aplicadas: nivel II · ${n2}   |   nivel III · ${n3}   |   total · ${sel.length}`), MX, y);
    y += 4;

    const titulos = {
      II: va ? "NIVELL II — Mesures amb tot el grup-aula" : "NIVEL II — Medidas con todo el grupo-aula",
      III: va ? "NIVELL III — Mesures personalitzades" : "NIVEL III — Medidas personalizadas"
    };
    const cab = [lat(va ? "Mesura" : "Medida"), lat(L.fFi), lat(L.fFf), lat(va ? "Descripció" : "Descripción"), lat(L.fVal), lat(L.fRes)];

    for (const niv of ["II", "III"]) {
      const body = [];
      for (const b of M.niveles[niv]) {
        const its = b.nodos.filter(n => n.tipo === "item" && S.sel[n.id]);
        if (!its.length) continue;
        body.push([{content: lat((window.BLOQUES[b.key] || {})[lang] || b.key).toUpperCase(), colSpan: 6,
          styles: {fillColor: SUAVE, textColor: NAVY, fontStyle: "bold", fontSize: 8.5}}]);
        for (const n of its) {
          const s = S.sel[n.id];
          let nombre = etq(n);
          if (n.otros && s.otros.trim()) nombre = (va ? "Altres: " : "Otros: ") + s.otros.trim();
          const padre = n.padres.length ? n.padres[n.padres.length - 1] : null;
          const medida = padre ? `${etq(padre)} > ${nombre}` : (n.nivel === "III" && n.num && n.num !== "—" ? `${n.num}. ${nombre}` : nombre);
          const fin = s.sinFin ? {content: lat(T.sinFin), styles: {fontStyle: "italic", textColor: GRIS}} : fmt(s.ff);
          body.push([lat(medida), fmt(s.fi), fin, lat(s.desc), lat(s.val ? VAL[s.val] : ""), lat(s.res)]);
        }
      }
      if (!body.length) continue;
      if (y > H - 40) { doc.addPage(); y = 16; }
      y += 6;
      doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...NAVY);
      doc.text(lat(titulos[niv]), MX, y);
      doc.autoTable({
        startY: y + 2.5, margin: {left: MX, right: MX, bottom: 16, top: 14}, theme: "grid",
        head: [cab], body, rowPageBreak: "avoid",
        headStyles: {fillColor: NAVY, textColor: 255, fontStyle: "bold", fontSize: 9},
        styles: {font: "helvetica", fontSize: 8.6, cellPadding: 1.8, lineColor: LINEA, lineWidth: 0.2, textColor: [19, 26, 43], valign: "top", overflow: "linebreak"},
        columnStyles: {0: {cellWidth: 72, fontStyle: "bold"}, 1: {cellWidth: 19, halign: "center"}, 2: {cellWidth: 19, halign: "center"},
          3: {cellWidth: "auto"}, 4: {cellWidth: 24}, 5: {cellWidth: 60}}
      });
      y = doc.lastAutoTable.finalY + 4;
    }
    if (!sel.length) {
      doc.setFont("helvetica", "italic"); doc.setFontSize(10); doc.setTextColor(...GRIS);
      doc.text(lat(T.cNada), MX, y + 8);
    }

    /* Pie de página en todas las hojas */
    const n = doc.getNumberOfPages();
    const hoy = new Date().toLocaleDateString(va ? "ca-ES" : "es-ES");
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setDrawColor(...LINEA); doc.setLineWidth(0.2); doc.line(MX, H - 11, W - MX, H - 11);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...GRIS);
      doc.text(lat(T.rgpd), MX, H - 7);
      doc.text(lat(`${a.nombre ? a.nombre + " · " : ""}${hoy} · ${va ? "Pàgina" : "Página"} ${i} / ${n}`), W - MX, H - 7, {align: "right"});
    }
    return doc.output("blob");
  }

  return {generar};
})();

<script>
/* Lógica de la aplicación: modelo, estado, pasos, autoguardado. */
(function () {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const LS_B = "medidas-ii-iii:borrador:v1", LS_P = "medidas-ii-iii:pref:v1";
  const NIVELES = ["II", "III"];

  /* ================= Modelo (catálogo leído de la plantilla + textos) ================= */
  const M = construirModelo();
  function construirModelo() {
    const base = window.CATALOGO_BASE, T = window.TEXTOS || {};
    const niveles = {II: [], III: []}, byId = {}, items = [];
    const dicc = Object.assign({}, window.XLSX_VA);
    for (const [k, b] of Object.entries(window.BLOQUES)) dicc[k] = b.va.toLocaleUpperCase("ca");
    for (const niv of NIVELES) {
      let bloque = null, grupos = {};
      for (const f of base[niv]) {
        if (f.tipo === "bloque" || !bloque || bloque.key !== f.bloque) {
          bloque = {tipo: "bloque", nivel: niv, key: f.bloque, r: f.r, nodos: []};
          niveles[niv].push(bloque); grupos = {};
          if (f.tipo === "bloque") continue;
        }
        const id = niv + "." + f.r, t = T[id] || {};
        const es = f.d || f.c;
        const n = {id, tipo: f.tipo, nivel: niv, r: f.r, bloque: bloque.key, num: f.num, c: f.c, d: f.d,
          es, va: t.va || es, x: t.x || null, e: (window.EJEMPLOS || {})[id] || t.e || null, et: t.et || null, otros: /^otros\b/i.test(es)};
        if (t.va) dicc[es] = t.va;
        const partes = String(f.num || "").split(".").filter(Boolean), pref = [];
        for (let i = 1; i < partes.length; i++) pref.push(partes.slice(0, i).join("."));
        if (f.tipo === "item" && f.d && f.num) pref.push(f.num);
        n.padres = pref.map(p => grupos[p]).filter(Boolean);
        n.depth = n.padres.length;
        if (f.tipo === "grupo") {
          for (const k of Object.keys(grupos)) if (k === f.num || k.startsWith(f.num + ".")) delete grupos[k];
          grupos[f.num] = n;
        }
        bloque.nodos.push(n); byId[id] = n;
        if (f.tipo === "item") items.push(n);
      }
    }
    return {niveles, byId, items, dicc};
  }
  window.MODELO = M;

  /* ================= Estado ================= */
  function cursoEscolarActual() {
    const d = new Date(), y = d.getFullYear();
    return d.getMonth() >= 7 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
  }
  function estadoVacio() {
    return {v: 1, alumno: {nombre: "", curso: "", grupo: "", cursoEsc: cursoEscolarActual(), tutor: ""},
      perfiles: [], sel: {}, ultima: {fi: "", ff: "", src: {fi: null, ff: null}}, paso: 0};
  }
  let S = estadoVacio();
  const P = {lang: null, centro: ""};
  const UI = {q: "", filtro: "todas", papelera: {}};
  let SUG = {m: new Map(), v: new Map()};

  const tieneDatos = s => !!(s.alumno.nombre || Object.keys(s.sel).length || s.perfiles.length);
  const t = (k, ...a) => { const v = window.I18N[P.lang][k]; return typeof v === "function" ? v(...a) : v; };
  const L = () => (P.lang === "va" ? 1 : 0);
  const etq = n => {
    const s = P.lang === "va" ? n.va : n.es;
    return s === s.toUpperCase() && /[A-ZÁÉÍÓÚÀÈÒ]{4}/.test(s) ? s.charAt(0) + s.slice(1).toLocaleLowerCase(P.lang === "va" ? "ca" : "es") : s;
  };
  const nomBloque = key => (window.BLOQUES[key] || {es: key, va: key})[P.lang];
  const nomNivel = niv => (P.lang === "va" ? "Nivell " : "Nivel ") + niv;

  function etapaDe(curso) {
    const c = norm(curso);
    if (!c) return null;
    if (/\bfpa\b|adult/.test(c)) return "FPA";
    if (/bach|batx/.test(c)) return "BACH";
    if (/\bfp\b|cfg|grado|grau|cicl|basica/.test(c)) return "FP";
    if (/\beso\b|secundaria/.test(c)) return "ESO";
    if (/primari/.test(c)) return "PRI";
    if (/infantil|anys|anos/.test(c)) return "INF";
    return null;
  }
  const etapaActual = () => etapaDe(S.alumno.curso);

  /* ---------- Persistencia (solo en este navegador) ---------- */
  let tGuardar = null;
  function guardar() {
    clearTimeout(tGuardar);
    tGuardar = setTimeout(() => {
      try {
        localStorage.setItem(LS_B, JSON.stringify(S));
        localStorage.setItem(LS_P, JSON.stringify({lang: P.lang, centro: P.centro}));
        const h = new Date().toLocaleTimeString(P.lang === "va" ? "ca-ES" : "es-ES", {hour: "2-digit", minute: "2-digit"});
        $("#estado").textContent = `${t("guardado")} · ${h}`;
      } catch (e) { $("#estado").textContent = t("sinGuardar"); }
    }, 300);
  }
  function sanear(b) {
    const s = Object.assign(estadoVacio(), b || {});
    s.alumno = Object.assign(estadoVacio().alumno, s.alumno || {});
    s.ultima = Object.assign({fi: "", ff: ""}, s.ultima || {});
    s.ultima.src = Object.assign({fi: null, ff: null}, s.ultima.src || {});
    s.perfiles = (Array.isArray(s.perfiles) ? s.perfiles : []).filter(id => window.PERFILES.some(p => p.id === id));
    const sel = {};
    for (const [id, v] of Object.entries(s.sel || {})) {
      if (!M.byId[id] || M.byId[id].tipo !== "item") continue;
      sel[id] = Object.assign({fi: "", ff: "", desc: "", val: "", res: "", otros: ""}, v);
      sel[id].src = Object.assign({fi: null, ff: null}, v.src || {});
      sel[id].sinFin = !!sel[id].sinFin;
      if (sel[id].sinFin) sel[id].ff = "";
      delete sel[id].auto;
    }
    s.sel = sel;
    s.paso = Math.min(4, Math.max(0, +s.paso || 0));
    return s;
  }
  function cargar() {
    try { const p = JSON.parse(localStorage.getItem(LS_P) || "null"); if (p) Object.assign(P, p); } catch (e) { /* sin acceso */ }
    try {
      const b = JSON.parse(localStorage.getItem(LS_B) || "null");
      if (b && b.v === 1) { S = sanear(b); return tieneDatos(S); }
    } catch (e) { /* sin acceso */ }
    return false;
  }

  /* ---------- Sugerencias por perfil ---------- */
  function calcSug() {
    const m = new Map(), v = new Map();
    const add = (map, id, p) => { if (!M.byId[id]) return; if (!map.has(id)) map.set(id, []); map.get(id).push(p); };
    for (const pid of S.perfiles) {
      const p = window.PERFILES.find(x => x.id === pid);
      if (!p) continue;
      p.m.forEach(id => add(m, id, p));
      p.v.forEach(id => add(v, id, p));
    }
    for (const k of m.keys()) v.delete(k);
    SUG = {m, v};
  }

  /* ---------- Selección ---------- */
  function seleccionar(id, on) {
    if (on) {
      if (S.sel[id]) return;
      S.sel[id] = UI.papelera[id] || {fi: S.ultima.fi, ff: S.ultima.ff, desc: "", val: "", res: "", otros: "", sinFin: false,
        src: {fi: S.ultima.fi ? S.ultima.src.fi : null, ff: S.ultima.ff ? S.ultima.src.ff : null}};
      delete UI.papelera[id];
    } else if (S.sel[id]) {
      UI.papelera[id] = S.sel[id];
      delete S.sel[id];
    }
    guardar();
  }
  const ordenados = () => M.items.filter(n => S.sel[n.id]);
  const nSel = niv => M.items.reduce((a, n) => a + (n.nivel === niv && S.sel[n.id] ? 1 : 0), 0);

  /* ================= Interfaz ================= */
  const vista = $("#vista");

  function aplicarIdioma() {
    document.documentElement.lang = P.lang === "va" ? "ca" : "es";
    document.title = P.lang === "va" ? "Mesures II i III" : "Medidas II y III";
    $$("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
    $$(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === P.lang)));
    render();
  }

  function renderPasos() {
    const cuenta = [null, nSel("II"), nSel("III"), nSel("II") + nSel("III"), null];
    $("#pasos").innerHTML = t("pasos").map((p, i) => `
      <button type="button" class="paso${i < S.paso ? " hecho" : ""}" data-paso="${i}" ${i === S.paso ? 'aria-current="step"' : ""}>
        <span class="n">${i + 1}</span><span class="t">${esc(p)}</span>${cuenta[i] ? `<span class="c">${cuenta[i]}</span>` : ""}
      </button>`).join("");
  }

  function render() {
    renderPasos();
    [renderAlumno, () => renderLista("II"), () => renderLista("III"), renderDetalles, renderExportar][S.paso]();
    vista.insertAdjacentHTML("beforeend", pie());
    $("#bAnt").disabled = S.paso === 0;
    $("#bSig").style.visibility = S.paso === 4 ? "hidden" : "visible";
    $("#bSig span").textContent = S.paso === 3 ? t("irExportar") : t("siguiente");
  }

  function irPaso(n) {
    flushFecha();
    S.paso = Math.max(0, Math.min(4, n));
    guardar();
    render();

    vista.innerHTML = `

  /* ---------- Pasos 2 y 3: listas de medidas ---------- */
  function renderLista(niv) {
    vista.innerHTML = `

          ${["todas", "elegidas", "sugeridas"].map(f => `<button type="button" data-filtro="${f}" aria-pressed="${UI.filtro === f}">${esc(t({todas: "fTodas", elegidas: "fElegidas", sugeridas: "fSugeridas"}[f]))}</button>`).join("")}

  function coincide(n, q) {
    if (!q) return true;
    const txt = norm([n.es, n.va, n.num].concat(n.padres.map(p => p.es + " " + p.va)).join(" "));
    return q.split(/\s+/).every(w => txt.includes(w));
  }

  function pintarListas(niv) {
    const cont = $("#listas");
    const q = norm(UI.q.trim()), et = etapaActual();
    let html = "", total = 0;
    for (const b of M.niveles[niv]) {
      const visibles = new Set();
      for (const n of b.nodos) {
        if (n.tipo !== "item") continue;
        const ok = coincide(n, q) && (UI.filtro === "todas" || (UI.filtro === "elegidas" && S.sel[n.id]) ||
          (UI.filtro === "sugeridas" && (SUG.m.has(n.id) || SUG.v.has(n.id))));
        if (ok) { visibles.add(n.id); n.padres.forEach(p => visibles.add(p.id)); }
      }
      const its = b.nodos.filter(n => n.tipo === "item");

    if (sec) {

  /* ---------- Paso 4: detalles ---------- */

      }
    }

    $$(".medida").forEach(avisos);
  }

  function tarjeta(n) {

    const ej = n.e && !s.desc ? `<button type="button" class="link" data-act="ejemplo">${esc(t("usarEjemplo"))}</button>` : "";
    return `<article class="card medida" data-id="${n.id}">
      <header>
        <div class="tt">${n.padres.length ? `<div class="ctx">${esc(contexto(n))}</div>` : ""}<h3>${esc(etq(n))}</h3></div>
        <button type="button" class="ib" data-act="info" aria-label="${esc(t("info") + ": " + etq(n))}" title="${esc(t("info"))}">i</button>
        <button type="button" class="btn ghost sm" data-act="quitar">${esc(t("quitar"))}</button>
      </header>
      <div class="grid">
        ${n.otros ? `<label class="f full">${esc(t("phOtros"))}<input type="text" data-f="otros" value="${esc(s.otros)}"><span class="hint warn" data-w="otros" hidden>${esc(t("wOtros"))}</span></label>` : ""}
        <div class="f-fi"><label class="f">${esc(t("fFi"))}<input type="date" data-f="fi" value="${esc(s.fi)}" min="2000-01-01" max="2100-12-31"></label>${atajosInicio(s)}</div>
        <div class="f-ff"><label class="f">${esc(t("fFf"))}<input type="date" data-f="ff" value="${esc(s.ff)}" min="2000-01-01" max="2100-12-31"${s.sinFin ? " disabled" : ""}></label>
          <label class="chk"><input type="checkbox" data-f="sinFin"${s.sinFin ? " checked" : ""}>${esc(t("sinFin"))}</label></div>
        <label class="f val">${esc(t("fVal"))}<select data-f="val">
          <option value="">${esc(t("sinValorar"))}</option>
          ${window.VALORACIONES.map(v => `<option value="${v.k}" ${s.val === v.k ? "selected" : ""}>${esc(v[P.lang])}</option>`).join("")}
        </select></label>
        <p class="hint warn full" data-w="fechas" hidden>${esc(t("wFechas"))}</p>
        <div class="full"><div class="desc-head"><label class="f" for="d_${id}">${esc(t("fDesc"))}</label>${ej}</div>
          <textarea id="d_${id}" data-f="desc" rows="3" placeholder="${esc(t("phDesc"))}">${esc(s.desc)}</textarea></div>
        <label class="f full">${esc(t("fRes"))}<textarea data-f="res" rows="2" placeholder="${esc(t("phRes"))}">${esc(s.res)}</textarea></label>
