  /* Accesos rápidos de fecha de inicio según el calendario escolar oficial del curso indicado. */
  const fmtF = iso => iso.split("-").reverse().join("/");
  function calendario() {
    const m = String(S.alumno.cursoEsc || "").match(/(20\d{2})\s*[-/–]\s*(\d{2,4})/);
    if (!m) return null;
    const y1 = +m[1], y2 = +m[2] < 100 ? 2000 + +m[2] : +m[2];
    const c = y2 === y1 + 1 ? (window.CALENDARIO || {})[`${y1}-${y2}`] : null;
    if (!c) return null;
    const et = etapaActual();
    return {c, et, ini: (et && c.inicio[et]) || c.inicio.def};
  }
  function atajosInicio(s) {
    const cal = calendario();
    if (!cal) return "";
    const ops = [["atIni", "atTitIni", cal.ini], ["atT2", "atTitT2", cal.c.t2], ["atT3", "atTitT3", cal.c.t3]];
    return `<div class="atajos" role="group" aria-label="${esc(t("atAria"))}">${ops.map(([k, tt, f]) =>
      `<button type="button" class="atajo" data-act="atajo" data-fecha="${f}" aria-pressed="${s.fi === f}" title="${esc(t(tt) + " · " + fmtF(f))}">${esc(t(k))} <span class="fch">${fmtF(f).slice(0, 5)}</span></button>`).join("")}</div>`;
  }
  function notaCalendario() {
    const cal = calendario();
    if (cal) {
      const extra = cal.et !== "FPA" && cal.c.inicio.FPA ? t("calFpa", fmtF(cal.c.inicio.FPA)) : "";
      return `<p class="hint cal">${esc(t("calNota", cal.c.fuente[P.lang], fmtF(cal.ini), fmtF(cal.c.t2), fmtF(cal.c.t3), extra))}</p>`;
    }
    return S.alumno.cursoEsc.trim() ? `<p class="hint cal">${esc(t("calNoDisp", S.alumno.cursoEsc.trim()))}</p>` : "";
  }

  function avisos(card) {
    const s = S.sel[card.dataset.id];
    if (!s) return;
    $$(".atajo", card).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.fecha === s.fi)));
    const wf = $("[data-w=fechas]", card), wo = $("[data-w=otros]", card);
    if (wf) wf.hidden = !(s.fi && s.ff && s.ff < s.fi);
    if (wo) wo.hidden = !!s.otros.trim();
  }

  /* Copia automática de fechas a las demás medidas elegidas.
     Cada fecha copiada recuerda de qué medida procede (src). Al cambiar la fecha de una
     medida se rellenan las medidas sin fecha y se actualizan las que la copiaron de ella;
     las fechas escritas a mano en otras medidas no se tocan. */
  let pend = null;
  const fechaValida = v => /^\d{4}-\d{2}-\d{2}$/.test(v) && +v.slice(0, 4) >= 2000 && +v.slice(0, 4) <= 2100;
  function fechaCambiada(id, campo, valor) {
    if (pend && (pend.id !== id || pend.campo !== campo)) flushFecha();
    const s = S.sel[id];
    s[campo] = valor;
    s.src[campo] = null;
    guardar();
    if (!pend) pend = {id, campo};
    clearTimeout(pend.t);
    pend.t = setTimeout(flushFecha, 900);
  }
  function flushFecha() {
    if (!pend) return;
    const {id, campo} = pend;
    clearTimeout(pend.t);
    pend = null;
    const s = S.sel[id];
    if (!s || !fechaValida(s[campo])) return;
    const v = s[campo], cambios = [];
    for (const [oid, o] of Object.entries(S.sel)) {
      if (oid === id || o[campo] === v) continue;
      if (campo === "ff" && o.sinFin) continue;   // marcada «Sin fecha de fin»: no se toca
      if (!o[campo] || o.src[campo] === id) {
        cambios.push([oid, o[campo], o.src[campo]]);
        o[campo] = v; o.src[campo] = id;
      }
    }
    // La fecha «común» (para medidas nuevas o al desmarcar «Sin fecha de fin») solo cambia si esta
    // medida es la que reparte la fecha; una fecha personalizada en otra medida no la sustituye.
    if (cambios.length || !S.ultima[campo] || S.ultima.src[campo] === id) { S.ultima[campo] = v; S.ultima.src[campo] = id; }
    guardar();
    if (!cambios.length) return;
    refrescarFechas(cambios.map(c => c[0]), campo);
    toast(t("copiada", cambios.length), t("deshacer"), () => {
      for (const [oid, old, oldSrc] of cambios) if (S.sel[oid]) { S.sel[oid][campo] = old; S.sel[oid].src[campo] = oldSrc; }
      guardar();
      refrescarFechas(cambios.map(c => c[0]), campo);
    });
  }
  /* «Sin fecha de fin»: vacía la fecha y la bloquea; al desmarcar se propone la última fecha copiada. */
  function marcarSinFin(card, on) {
    flushFecha();
    const id = card.dataset.id, s = S.sel[id], inp = $("[data-f=ff]", card);
    s.sinFin = on;
    if (on) { s.ff = ""; s.src.ff = null; }
    else if (!s.ff && S.ultima.ff) { s.ff = S.ultima.ff; s.src.ff = S.ultima.src.ff; }
    inp.value = s.ff;
    inp.disabled = on;
    guardar();
    avisos(card);
  }

  function refrescarFechas(ids, campo) {
    for (const oid of ids) {
      const card = $(`.medida[data-id="${oid}"]`);
      if (!card || !S.sel[oid]) continue;
      const inp = $(`[data-f="${campo}"]`, card);
      if (inp && document.activeElement !== inp) inp.value = S.sel[oid][campo];
      avisos(card);
    }
  }

  /* ---------- Paso 5: exportar ---------- */
  function renderExportar() {
    const sel = ordenados();
    let filas = "";
    for (const niv of NIVELES) {
      filas += `<tr class="niv"><td>${esc(nomNivel(niv))}</td><td class="n">${nSel(niv)}</td></tr>`;
      for (const b of M.niveles[niv]) {
        const c = b.nodos.filter(n => n.tipo === "item" && S.sel[n.id]).length;
        filas += `<tr><td>${esc(nomBloque(b.key))}</td><td class="n">${c}</td></tr>`;
      }
    }
    filas += `<tr class="tot"><td>${esc(t("total"))}</td><td class="n">${sel.length}</td></tr>`;
    const checks = [];
    if (!S.alumno.nombre.trim()) checks.push(["w", t("cNombre")]);
    if (!sel.length) checks.push(["w", t("cNada")]);
    const sinFi = sel.filter(n => !S.sel[n.id].fi).length;
    if (sinFi) checks.push(["w", t("cFi", sinFi)]);
    const sinOtros = sel.filter(n => n.otros && !S.sel[n.id].otros.trim()).length;
    if (sinOtros) checks.push(["w", t("cOtros", sinOtros)]);
    if (!checks.length) checks.push(["ok", t("cOk")]);
    vista.innerHTML = `
      <h1>${esc(t("exportarH"))}</h1>
      <p class="lead">${esc(t("exportarLead"))}</p>
      <div class="grid g2" style="align-items:start">
        <div class="card"><table class="res"><thead><tr><th>${esc(t("tNivelBloque"))}</th><th class="n">${esc(t("tMedidas"))}</th></tr></thead><tbody>${filas}</tbody></table></div>
        <div class="card stack">
          <ul class="checks">${checks.map(([k, m]) => `<li class="${k}"><svg class="i"><use href="#i-${k === "ok" ? "check" : "warn"}"/></svg><span>${esc(m)}</span></li>`).join("")}</ul>
          <div class="descargas">
            <button type="button" class="btn primary" id="dExcel"><svg class="i"><use href="#i-xls"/></svg><span>${esc(t("dExcel"))}</span></button>
            <button type="button" class="btn" id="dPdf"><svg class="i"><use href="#i-pdf"/></svg><span>${esc(t("dPdf"))}</span></button>
          </div>
          <p class="privacidad">${esc(t("rgpd"))}</p>
        </div>
      </div>`;
  }

  const pie = () => `<footer class="pie"><p>${esc(t("pie"))}</p>
    <p>© 2026 Pedro J. Lledó Sigüenza · ${esc(t("lic"))} <a href="https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12" target="_blank" rel="noopener">EUPL-1.2</a>
    · <a href="https://github.com/pjlledo/mesures" target="_blank" rel="noopener">${esc(t("codigo"))}</a>
    · <a href="https://orienteca.es/" target="_blank" rel="noopener">orienteca.es</a></p></footer>`;

  function nombreArchivo(ext) {
    const slug = s => norm(s).replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
    const partes = [P.lang === "va" ? "Mesures_II_III" : "Medidas_II_III", slug(S.alumno.nombre) || (P.lang === "va" ? "alumne" : "alumno"), slug(S.alumno.cursoEsc)];
    return partes.filter(Boolean).join("_") + "." + ext;
  }
  function descargar(blob, nombre) {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = nombre; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function exportar(tipo, btn) {
    flushFecha();
    const span = $("span", btn), txt = span.textContent;
    btn.disabled = true; span.textContent = t("generando");
    try {
      const datos = {estado: S, modelo: M, lang: P.lang, centro: P.centro};
      const blob = tipo === "xlsx" ? await window.XLSXIO.exportar(datos) : await window.PDFGEN.generar(datos);
      descargar(blob, nombreArchivo(tipo));
    } catch (e) {
      console.error(e);
      toast(t("errExport"));
    } finally { btn.disabled = false; span.textContent = txt; }
  }

  /* ---------- Ventanas: explicación de la medida y normativa ---------- */
  const dlg = $("#dlg"), dlgIn = $("#dlgIn");
  function abrirDialogo(html) {
    dlgIn.innerHTML = html;
    if (typeof dlg.showModal === "function") { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", "");
    $(".dlg-body", dlgIn).scrollTop = 0;
  }
  const cerrarDialogo = () => (typeof dlg.close === "function" ? dlg.close() : dlg.removeAttribute("open"));

  function abrirInfo(id) {
    const n = M.byId[id], l = L();
    const x = n.x ? n.x[l] : (n.otros ? t("otrosX") : "");
    const chips = `<span class="chip et">${esc(nomNivel(n.nivel))}</span> <span class="chip">${esc(nomBloque(n.bloque))}</span>` +
      (n.num && n.num !== "—" ? ` <span class="chip">${esc(n.num)}</span>` : "") +
      (n.et ? ` <span class="chip et">${esc(n.et.map(e => t("etapas")[e]).join(" · "))}</span>` : "");
    let cuerpo = "";
    if (n.padres.length) {
      cuerpo += `<h3>${esc(t("formaParte"))}</h3>` + n.padres.map(p => `<div class="ctxbox"><p><b>${esc((p.num ? p.num + " " : "") + etq(p))}</b></p>${p.x ? `<p>${esc(p.x[l])}</p>` : ""}</div>`).join("");
    }
    if (x) cuerpo += `<h3>${esc(t("qEs"))}</h3><p>${esc(x)}</p>`;
    if (n.e) cuerpo += `<h3>${esc(t("ejemplo"))}</h3><div class="ejemplo"><p>${esc(n.e[l])}</p></div>`;
    if (n.tipo === "grupo") {
      const hijos = M.items.filter(i => i.padres.includes(n));
      if (hijos.length) cuerpo += `<ul>${hijos.map(h => `<li>${esc(etq(h))}</li>`).join("")}</ul>`;
    }
    const sg = SUG.m.get(id), vs = SUG.v.get(id);
    if (sg) cuerpo += `<h3>${esc(t("sugeridaPara"))}</h3><p>${esc(sg.map(p => p[P.lang]).join(" · "))}</p>`;
    if (vs) cuerpo += `<h3>${esc(t("valorarEn"))}</h3><p>${esc(vs.map(p => p[P.lang]).join(" · "))}</p>`;
    const on = !!S.sel[id];
    abrirDialogo(`
      <div class="dlg-head"><div class="tt">${chips}<h2 id="dlgT">${esc(etq(n))}</h2></div>
        <button type="button" class="x" data-act="cerrar" aria-label="${esc(t("cerrar"))}"><svg class="i"><use href="#i-x"/></svg></button></div>
      <div class="dlg-body">${cuerpo}</div>
      <div class="dlg-foot">
        ${n.tipo === "item" ? `<button type="button" class="btn ${on ? "ghost" : "primary"}" data-act="dlg-toggle" data-id="${id}">${esc(on ? t("quitarSel") : t("elegir"))}</button>` : ""}
        <button type="button" class="btn ghost" data-act="cerrar">${esc(t("cerrar"))}</button>
      </div>`);
    dlg.setAttribute("aria-labelledby", "dlgT");
  }

  function abrirNormativa() {
    abrirDialogo(`
      <div class="dlg-head"><div class="tt"><h2 id="dlgT">${esc(t("normativa"))}</h2></div>
        <button type="button" class="x" data-act="cerrar" aria-label="${esc(t("cerrar"))}"><svg class="i"><use href="#i-x"/></svg></button></div>
      <div class="dlg-body">${window.NORMATIVA[P.lang]}</div>
      <div class="dlg-foot"><button type="button" class="btn ghost" data-act="cerrar">${esc(t("cerrar"))}</button></div>`);
    dlg.setAttribute("aria-labelledby", "dlgT");
  }

  /* ---------- Aviso flotante ---------- */
  let tToast = null;
  function toast(msg, accion, fn) {
    const el = $("#toast"), b = $("#toastBtn");
    $("#toastTxt").textContent = msg;
    b.hidden = !accion;
    b.textContent = accion || "";
    b.onclick = () => { el.classList.remove("show"); fn && fn(); };
    el.classList.add("show");
    clearTimeout(tToast);
    tToast = setTimeout(() => el.classList.remove("show"), accion ? 7000 : 3500);
  }

  /* ---------- Abrir Excel / Nuevo ---------- */
  async function abrirExcel(file) {
    try {
      const buf = await file.arrayBuffer();
      const r = await window.XLSXIO.importar(buf, M);
      if (tieneDatos(S) && !window.confirm(t("confReemplazar"))) return;
      S = sanear(Object.assign(estadoVacio(), r, {perfiles: [], paso: 3}));
      UI.papelera = {};
      calcSug(); guardar(); render(); window.scrollTo(0, 0);
      toast(t("cargado", Object.keys(S.sel).length));
    } catch (e) {
      console.error(e);
      toast(t("errExcel"));
    }
  }
  function nuevo() {
    if (tieneDatos(S) && !window.confirm(t("confNuevo"))) return;
    S = estadoVacio(); UI.papelera = {}; UI.q = ""; UI.filtro = "todas";
    calcSug(); guardar(); render(); window.scrollTo(0, 0);
    toast(t("nuevoOk"));
  }

  /* ================= Eventos ================= */
  $("#pasos").addEventListener("click", e => { const b = e.target.closest("[data-paso]"); if (b) irPaso(+b.dataset.paso); });
  $("#bAnt").addEventListener("click", () => irPaso(S.paso - 1));
  $("#bSig").addEventListener("click", () => irPaso(S.paso + 1));
  $$(".lang button").forEach(b => b.addEventListener("click", () => { flushFecha(); P.lang = b.dataset.lang; guardar(); aplicarIdioma(); }));
  $("#bNormativa").addEventListener("click", abrirNormativa);
  $("#bAbrir").addEventListener("click", () => $("#fExcel").click());
  $("#fExcel").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) abrirExcel(f); });
  $("#bNuevo").addEventListener("click", nuevo);
  dlg.addEventListener("click", e => {
    if (e.target === dlg) return cerrarDialogo();
    const a = e.target.closest("[data-act]");
    if (!a) return;
    if (a.dataset.act === "cerrar") cerrarDialogo();
    if (a.dataset.act === "dlg-toggle") {
      const id = a.dataset.id, on = !S.sel[id];
      const li = $(`.item[data-id="${id}"]`);
      if (li) toggleEnLista(li, on); else { seleccionar(id, on); render(); }
      cerrarDialogo();
    }
  });

  vista.addEventListener("click", e => {
    const a = e.target.closest("[data-act],[data-perfil],[data-filtro],#bPremarcar,#dExcel,#dPdf");
    if (!a) return;
    if (a.id === "bPremarcar") return premarcar();
    if (a.id === "dExcel") return exportar("xlsx", a);
    if (a.id === "dPdf") return exportar("pdf", a);
    if (a.dataset.perfil) {
      const id = a.dataset.perfil, i = S.perfiles.indexOf(id);
      if (i >= 0) S.perfiles.splice(i, 1); else S.perfiles.push(id);
      a.setAttribute("aria-pressed", String(i < 0));
      calcSug(); pintarSugbar(); guardar();
      return;
    }
    if (a.dataset.filtro) {
      UI.filtro = a.dataset.filtro;
      $$("[data-filtro]").forEach(b => b.setAttribute("aria-pressed", String(b === a)));
      return pintarListas($("#listas").dataset.nivel);
    }
    const holder = a.closest("[data-id]");
    const id = holder && holder.dataset.id;
    switch (a.dataset.act) {
      case "info": return abrirInfo(id);
      case "quitar": {
        flushFecha();
        seleccionar(id, false); renderPasos();
        holder.remove();
        $$(".det-bloque").forEach(s => { if (!$(".medida", s)) s.remove(); });
        if (!ordenados().length) render();
        toast(etq(M.byId[id]), t("deshacer"), () => { seleccionar(id, true); render(); });
        return;
      }
      case "atajo": {
        const inp = $("[data-f=fi]", holder);
        inp.value = a.dataset.fecha;
        fechaCambiada(id, "fi", inp.value);
        flushFecha();   // se copia al momento a las demás medidas, como al escribirla
        avisos(holder);
        return;
      }
      case "ejemplo": {
        const n = M.byId[id], ta = $("[data-f=desc]", holder);
        ta.value = n.e[L()];
        S.sel[id].desc = ta.value; guardar();
        a.remove(); ta.focus();
        return;
      }
    }
  });

  vista.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.act === "toggle") return toggleEnLista(el.closest(".item"), el.checked);
    if (el.dataset.f === "sinFin") return marcarSinFin(el.closest(".medida"), el.checked);
    if (el.dataset.f === "val") {
      const card = el.closest(".medida");
      S.sel[card.dataset.id].val = el.value; guardar();
    }
  });

  vista.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "q") { UI.q = el.value; return pintarListas($("#listas").dataset.nivel); }
    if (el.dataset.a) {
      if (el.dataset.a === "centro") P.centro = el.value;
      else S.alumno[el.dataset.a] = el.value;
      if (el.dataset.a === "curso") {
        const et = etapaActual();
        $("#etapa").textContent = et ? t("etapa") + ": " + t("etapas")[et] : "";
      }
      return guardar();
    }
    if (el.dataset.act === "otros") {
      S.sel[el.closest(".item").dataset.id].otros = el.value;
      return guardar();
    }
    const card = el.closest(".medida");
    if (!card || !el.dataset.f || el.type === "checkbox") return;
    const id = card.dataset.id, f = el.dataset.f;
    if (f === "fi" || f === "ff") fechaCambiada(id, f, el.value);
    else { S.sel[id][f] = el.value; guardar(); }
    avisos(card);
  });
  vista.addEventListener("focusout", e => { if (e.target.type === "date") flushFecha(); });
  window.addEventListener("beforeunload", () => {
    flushFecha();
    try { localStorage.setItem(LS_B, JSON.stringify(S)); } catch (e) { /* sin acceso */ }
  });

  /* ================= Inicio ================= */
  // La barra de búsqueda queda fija justo debajo de la cabecera (cuya altura varía).
  const fijarAltura = () => document.documentElement.style.setProperty("--topbar-h", $(".topbar").offsetHeight + "px");
  if ("ResizeObserver" in window) new ResizeObserver(fijarAltura).observe($(".topbar")); else fijarAltura();
  const recuperado = cargar();
  if (P.lang !== "es" && P.lang !== "va") P.lang = /^(ca|va)/i.test(navigator.language || "") ? "va" : "es";
  calcSug();
  aplicarIdioma();
  if (recuperado) toast(t("recuperado"));
})();

</script>
</body>
</html>
